<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Form</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
  <div class="form-container">
    <h1>Enter Your Details</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Enter your Full Name" required>
      <input type="text" name="title" placeholder="Job Title" required>
      <input type="text" name="email" placeholder="Email" required>
      <input type="text" name="phone" placeholder="Phone" required>
      <input type="text" name="address" placeholder="Address" required>
      <input type="file" name="photo" accept="image/*" required>
      <textarea name="description" placeholder="Job Description / Bio" required></textarea>
      <textarea name="skills" placeholder="Skills (comma-separated)" required></textarea>
      <textarea name="education" placeholder="Education" required></textarea>
      <textarea name="experience" placeholder="Work Experience" required></textarea>
      <button type="submit" class="btn animated">Generate Portfolio</button>
    </form>
  </div>
</body>
</html>
